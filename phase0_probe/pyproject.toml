[project]
name = "phase0-probe"
version = "0.1.0"
description = "Arcus x Hyperliquid (core + Entropy HIP-3 dex 'io') Phase 0 READ-ONLY arbitrage validation"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "websockets>=12"]

[dependency-groups]
dev = ["pytest>=8", "pyflakes>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase0_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
